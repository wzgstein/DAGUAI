name: Temporary Round 21 scGPT contextual gate fixed

on:
  push:
    branches:
      - tmp-round21-contextual-preflight-20260827
    paths:
      - '.github/workflows/tmp-round21-scgpt-contextual-fixed.yml'
      - 'round21_fixed/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-round21-scgpt-contextual-fixed-20260827
  cancel-in-progress: true

jobs:
  contextual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-round21-contextual-preflight-20260827
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Inject H5AD, sparse-dtype, and categorical compatibility patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('round21_fixed/run.sh')
          s = p.read_text()
          needle = "python -m py_compile round21_fixed/round20_base.py round21_fixed/round21_scgpt_contextual.py\n"
          patch = r'''python - <<'PY2'
          from pathlib import Path
          p = Path('round21_fixed/round21_scgpt_contextual.py')
          s = p.read_text()

          old_control = "    s = values.fillna(\"\").astype(str).str.lower().str.strip()\n"
          new_control = "    s = values.astype(\"string\").fillna(\"\").str.lower().str.strip()\n"
          if s.count(old_control) != 1:
              raise RuntimeError(f'categorical patch target count={s.count(old_control)}')
          s = s.replace(old_control, new_control)

          insertion = "\n\ndef load_control_subset(\n"
          helper = r'''

          def read_h5ad_matrix_subset(
              path: Path,
              node_path: str,
              row_indices: np.ndarray,
              col_indices: np.ndarray,
          ):
              """Read a small row/column subset with explicit float32 sparse dtype.

              This bypasses anndata/scipy backed sparse indexing incompatibilities
              observed for the public CSR/CSC Replogle objects. Scientific row and
              column selections are unchanged.
              """
              import h5py

              rows = np.asarray(row_indices, dtype=np.int64)
              cols = np.asarray(col_indices, dtype=np.int64)
              if rows.ndim != 1 or cols.ndim != 1:
                  raise ValueError("row and column indices must be one-dimensional")
              if np.any(np.diff(rows) < 0):
                  raise ValueError("row indices must be sorted")

              def decoded(value):
                  if isinstance(value, bytes):
                      return value.decode("utf-8")
                  return str(value)

              with h5py.File(path, "r") as handle:
                  node = handle[node_path]
                  if isinstance(node, h5py.Dataset):
                      dense = np.asarray(node[rows, :], dtype=np.float32)
                      return sparse.csr_matrix(dense[:, cols], dtype=np.float32)

                  encoding = decoded(node.attrs.get("encoding-type", ""))
                  shape_raw = node.attrs.get("shape")
                  if shape_raw is None and "shape" in node:
                      shape_raw = node["shape"][...]
                  n_rows, n_cols = tuple(int(x) for x in np.asarray(shape_raw).ravel())

                  if encoding == "csr_matrix":
                      indptr = np.asarray(node["indptr"][...], dtype=np.int64)
                      out_indptr = np.zeros(rows.size + 1, dtype=np.int64)
                      data_parts = []
                      index_parts = []
                      cursor = 0
                      for j, row in enumerate(rows.tolist()):
                          start, stop = int(indptr[row]), int(indptr[row + 1])
                          if stop > start:
                              data_parts.append(np.asarray(node["data"][start:stop], dtype=np.float32))
                              index_parts.append(np.asarray(node["indices"][start:stop], dtype=np.int64))
                              cursor += stop - start
                          out_indptr[j + 1] = cursor
                      data = np.concatenate(data_parts) if data_parts else np.empty(0, dtype=np.float32)
                      indices = np.concatenate(index_parts) if index_parts else np.empty(0, dtype=np.int64)
                      full = sparse.csr_matrix((data, indices, out_indptr), shape=(rows.size, n_cols), dtype=np.float32)
                      return full[:, cols].tocsr().astype(np.float32)

                  if encoding == "csc_matrix":
                      indptr = np.asarray(node["indptr"][...], dtype=np.int64)
                      row_map = np.full(n_rows, -1, dtype=np.int64)
                      row_map[rows] = np.arange(rows.size, dtype=np.int64)
                      data_parts = []
                      row_parts = []
                      col_parts = []
                      for output_col, original_col in enumerate(cols.tolist()):
                          start, stop = int(indptr[original_col]), int(indptr[original_col + 1])
                          if stop <= start:
                              continue
                          original_rows = np.asarray(node["indices"][start:stop], dtype=np.int64)
                          local_rows = row_map[original_rows]
                          keep = local_rows >= 0
                          if not np.any(keep):
                              continue
                          data_parts.append(np.asarray(node["data"][start:stop], dtype=np.float32)[keep])
                          row_parts.append(local_rows[keep])
                          col_parts.append(np.full(int(np.sum(keep)), output_col, dtype=np.int64))
                      if data_parts:
                          matrix = sparse.coo_matrix(
                              (
                                  np.concatenate(data_parts),
                                  (np.concatenate(row_parts), np.concatenate(col_parts)),
                              ),
                              shape=(rows.size, cols.size),
                              dtype=np.float32,
                          ).tocsr()
                      else:
                          matrix = sparse.csr_matrix((rows.size, cols.size), dtype=np.float32)
                      return matrix

                  raise ValueError(f"unsupported H5AD matrix encoding {encoding!r} at {node_path}")
          '''
          if s.count(insertion) != 1:
              raise RuntimeError(f'helper insertion point count={s.count(insertion)}')
          s = s.replace(insertion, helper + insertion)

          old_subset = '''    sub = a[control_idx, np.asarray(cols, dtype=int)].to_memory()
              raw_shape = [int(a.n_obs), int(a.n_vars)]
              obs_columns = [str(x) for x in a.obs.columns]
              var_columns = [str(x) for x in a.var.columns]
              if getattr(a, "file", None) is not None:
                  a.file.close()
              x, matrix_meta = select_source_matrix(sub)
          '''
          new_subset = '''    raw_shape = [int(a.n_obs), int(a.n_vars)]
              obs_columns = [str(x) for x in a.obs.columns]
              var_columns = [str(x) for x in a.var.columns]
              layer_name = next((candidate for candidate in ("counts", "raw_counts") if candidate in a.layers), None)
              node_path = f"layers/{layer_name}" if layer_name else "X"
              layer_keys = [str(x) for x in a.layers.keys()]
              if getattr(a, "file", None) is not None:
                  a.file.close()
              raw_matrix = read_h5ad_matrix_subset(
                  path,
                  node_path,
                  control_idx,
                  np.asarray(cols, dtype=np.int64),
              )
              temporary = ad.AnnData(X=raw_matrix)
              x, matrix_meta = select_source_matrix(temporary)
              matrix_meta["source"] = node_path
          '''
          if s.count(old_subset) != 1:
              raise RuntimeError(f'subset patch target count={s.count(old_subset)}')
          s = s.replace(old_subset, new_subset)

          old_layers = '        "layers": list(sub.layers.keys()),\n'
          new_layers = '        "layers": layer_keys,\n'
          if s.count(old_layers) != 1:
              raise RuntimeError(f'layers patch target count={s.count(old_layers)}')
          s = s.replace(old_layers, new_layers)

          p.write_text(s)
          print('patched categorical labels and explicit float32 CSR/CSC H5AD subset reader')
          PY2
          '''
          if s.count(needle) != 1:
              raise RuntimeError(f'compile insertion point count={s.count(needle)}')
          p.write_text(s.replace(needle, patch + needle))
          PY
      - name: Run compatibility-fixed real contextual gate
        run: bash round21_fixed/run.sh
      - name: Record provenance and remove biological/model payloads
        if: always()
        run: |
          mkdir -p results
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner=${RUNNER_OS}"
            python --version || true
            python -m pip freeze || true
          } > results/PROVENANCE.txt
          rm -rf data vendor
          find results -type f -printf '%P %s bytes\n' | sort > results/RESULT_FILE_SIZES.txt || true
          du -sh results || true
      - name: Upload derived results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round21-scgpt-contextual-fixed
          path: results/
          if-no-files-found: error
          retention-days: 14
