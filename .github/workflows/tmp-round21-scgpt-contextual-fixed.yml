name: Temporary Round 21 scGPT contextual gate fixed

on:
  push:
    branches:
      - tmp-round21-contextual-preflight-20260827
    paths:
      - '.github/workflows/tmp-round21-scgpt-contextual-fixed.yml'
      - 'round21_fixed/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-round21-scgpt-contextual-fixed-20260827
  cancel-in-progress: true

jobs:
  contextual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-round21-contextual-preflight-20260827
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Inject audited compatibility patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('round21_fixed/run.sh')
          s = p.read_text()
          needle = "python -m py_compile round21_fixed/round20_base.py round21_fixed/round21_scgpt_contextual.py\n"
          patch = (
              "python round21_fixed/patch_contextual_compat.py\n"
              "python round21_fixed/patch_disable_nested.py\n"
              "python -m py_compile round21_fixed/patch_contextual_compat.py round21_fixed/patch_disable_nested.py\n"
          )
          if s.count(needle) != 1:
              raise RuntimeError(f'compile insertion point count={s.count(needle)}')
          p.write_text(s.replace(needle, patch + needle))
          PY
      - name: Run compatibility-fixed real contextual gate
        run: bash round21_fixed/run.sh
      - name: Assert scientific outputs exist
        if: success()
        run: |
          test -s results/KEY_FINDINGS.json
          test -s results/COMBINED_SUMMARY.csv
          test -s results/CROSS_LINE_SUMMARY.csv
      - name: Record provenance and remove biological/model payloads
        if: always()
        run: |
          mkdir -p results
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner=${RUNNER_OS}"
            python --version || true
            python -m pip freeze || true
          } > results/PROVENANCE.txt
          rm -rf data vendor
          find results -type f -printf '%P %s bytes\n' | sort > results/RESULT_FILE_SIZES.txt || true
          du -sh results || true
      - name: Upload derived results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round21-scgpt-contextual-fixed
          path: results/
          if-no-files-found: error
          retention-days: 14
