name: Temporary Round 21 contextual Geneformer utilization gate

on:
  push:
    branches:
      - tmp-round21-contextual-utilization-20260827
    paths:
      - '.github/workflows/tmp-round21-contextual-utilization.yml'
      - 'tmp_round21/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-round21-contextual-utilization-20260827
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: tmp-round21-contextual-utilization-20260827

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install stack and reconstruct audited sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install anndata h5py numpy pandas scipy scikit-learn matplotlib tabulate safetensors huggingface_hub awscli
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          base64 --decode tmp_round21/round21_contextual_utilization.py.gz.b64 | gzip -dc > tmp_round21/round21_contextual_utilization.py
          echo '5246b81e9033de959ac71b1092e9c521e999b5ef722a16c794bc14c785344a1b  tmp_round21/round21_contextual_utilization.py' | sha256sum -c -
          curl -L --fail --retry 8 --retry-all-errors \
            https://raw.githubusercontent.com/wzgstein/DAGUAI/9cc0bc29e73f6ce926b788d76cc08b36deb36d6e/tmp_round20/round20_static_utilization.py \
            -o tmp_round21/round20_static_utilization.py
          echo '8ecb07bcb7f48d7b1bab4f9e05642e7b5a616bd114fd41812e13de5f25f2a171  tmp_round21/round20_static_utilization.py' | sha256sum -c -
          python -m py_compile tmp_round21/round20_static_utilization.py tmp_round21/round21_contextual_utilization.py
          python tmp_round21/round20_static_utilization.py --self-test

      - name: Download perturbation data and CORUM snapshot
        run: |
          set -euo pipefail
          mkdir -p data/embeddings data/scgpt data/geneformer data/pathd_cache results
          curl -L --fail --retry 12 --retry-all-errors --retry-delay 8 \
            https://ndownloader.figshare.com/files/35773217 -o data/K562_raw.h5ad
          curl -L --fail --retry 12 --retry-all-errors --retry-delay 8 \
            https://ndownloader.figshare.com/files/35775512 -o data/RPE1_raw.h5ad
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 8 \
            https://raw.githubusercontent.com/broadinstitute/2022_PERISCOPE/17d345046beee46c8fa8601f970b66651232e7ed/common_files/CORUM_humanComplexes.txt \
            -o data/humanComplexes.txt
          sha256sum data/K562_raw.h5ad data/RPE1_raw.h5ad data/humanComplexes.txt | tee results/PRIMARY_DATA_SHA256.txt

      - name: Freeze significant perturbation population
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import anndata as ad
          import numpy as np
          import pandas as pd
          from scipy import sparse
          report={}
          for src,dst in [(Path('data/K562_raw.h5ad'),Path('data/K562_significant.h5ad')),(Path('data/RPE1_raw.h5ad'),Path('data/RPE1_significant.h5ad'))]:
              a=ad.read_h5ad(src)
              x=a.X.toarray() if sparse.issparse(a.X) else np.asarray(a.X)
              finite=np.isfinite(x).all(axis=1)
              p=pd.to_numeric(a.obs['energy_test_p_value'],errors='coerce').to_numpy(float)
              keep=finite & np.isfinite(p) & (p<1e-3)
              if keep.sum()<200: raise RuntimeError(f'too few rows for {src}: {keep.sum()}')
              report[src.name]={'rows_before':int(a.n_obs),'rows_finite':int(finite.sum()),'rows_kept':int(keep.sum()),'rule':'finite response and energy_test_p_value < 0.001'}
              a[keep].copy().write_h5ad(dst,compression='gzip')
          Path('results/SIGNIFICANT_ROW_FILTER.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          rm data/K562_raw.h5ad data/RPE1_raw.h5ad

      - name: Download static comparison embeddings and Geneformer dictionaries
        run: |
          set -euo pipefail
          aws s3 sync --no-sign-request s3://czi-scgenept-public/models/pretrained/scgpt data/scgpt
          aws s3 cp --no-sign-request \
            's3://czi-scgenept-public/models/gene_embeddings/NCBI+UniProt_embeddings-gpt3.5-ada.pkl' \
            'data/embeddings/NCBI+UniProt_embeddings-gpt3.5-ada.pkl'
          aws s3 cp --no-sign-request \
            's3://czi-scgenept-public/models/gene_embeddings/GO_C_gene_embeddings-gpt3.5-ada-concat.pickle' \
            'data/embeddings/GO_C_gene_embeddings-gpt3.5-ada_avg.pickle'
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          repo='ctheodoris/Geneformer'
          for name in ['Geneformer-V2-104M/model.safetensors','geneformer/token_dictionary_gc104M.pkl','geneformer/gene_name_id_dict_gc104M.pkl']:
              print(hf_hub_download(repo_id=repo,filename=name,local_dir='data/geneformer'))
          PY
          sha256sum $(find data/scgpt data/embeddings data/geneformer -type f | sort) > results/EMBEDDING_SHA256.txt

      - name: Download and extract audited ISP path-D caches
        run: |
          set -euo pipefail
          curl -L --fail --retry 10 --retry-all-errors --retry-delay 8 \
            --connect-timeout 30 --speed-limit 1024 --speed-time 180 \
            'https://zenodo.org/records/20729460/files/isp_confound_reproduction_bundle.zip?download=1' \
            -o data/isp_bundle.zip
          echo '3ac102e8b5f410b7e2bf4a650d00ae76010c5cbb973a5b8abc750d863d9cd613  data/isp_bundle.zip' | sha256sum -c -
          unzip -j data/isp_bundle.zip 'benchmark_output/pathd_cache/*_cache.npz' -d data/pathd_cache
          rm data/isp_bundle.zip
          ls -lh data/pathd_cache | tee results/PATHD_CACHE_FILES.txt
          sha256sum data/pathd_cache/*.npz > results/PATHD_CACHE_SHA256.txt

      - name: Run contextual geometry and limited native-readout gate
        run: |
          set -euo pipefail
          /usr/bin/time -v python tmp_round21/round21_contextual_utilization.py \
            --round20-source tmp_round21/round20_static_utilization.py \
            --k562 data/K562_significant.h5ad \
            --rpe1 data/RPE1_significant.h5ad \
            --corum data/humanComplexes.txt \
            --cache-root data/pathd_cache \
            --embedding-dir data/embeddings \
            --scgpt-dir data/scgpt \
            --geneformer-model data/geneformer/Geneformer-V2-104M/model.safetensors \
            --geneformer-token data/geneformer/geneformer/token_dictionary_gc104M.pkl \
            --geneformer-name-id data/geneformer/geneformer/gene_name_id_dict_gc104M.pkl \
            --out results \
            --response-genes 2000 \
            --variance-sample-rows 1200 \
            --folds 5 \
            --random-reps 8 2>&1 | tee results/RUN_LOG.txt

      - name: Record provenance and remove source biological/model files
        if: always()
        run: |
          mkdir -p results
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner=${RUNNER_OS}"
            python --version || true
            python -m pip freeze || true
          } > results/PROVENANCE.txt
          rm -rf data
          find results -type f -printf '%P %s bytes\n' | sort > results/RESULT_FILE_SIZES.txt || true
          du -sh results || true

      - name: Upload derived results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round21-contextual-utilization
          path: results/
          if-no-files-found: error
          retention-days: 14
